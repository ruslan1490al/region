<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ товаров</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 600px; margin: 0 auto; background-color: #f4f5f7; color: #222; }
        h2 { text-align: center; margin-bottom: 20px; font-size: 22px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; background: #fff; }
        input[type="text"]:focus, textarea:focus { border-color: #25D366; }

        .catalog { margin-top: 20px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .catalog h3 { margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; font-size: 18px; }

        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .product-item:last-child { border-bottom: none; }
        .product-info { flex-grow: 1; padding-right: 10px; }
        .product-title { font-weight: 600; font-size: 15px; }
        .product-price { color: #666; font-size: 13px; margin-top: 2px; }

        .qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn { width: 36px; height: 36px; border: 1px solid #ddd; background: #f8f9fa; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 18px; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
        .qty-btn:active { background: #e2e6ea; }
        .qty-input { width: 45px !important; text-align: center; padding: 6px 2px !important; margin: 0; font-size: 16px; font-weight: bold; border: 1px solid #ddd; border-radius: 6px; }

        .total-box { font-size: 18px; font-weight: 700; text-align: right; margin-top: 15px; padding-top: 10px; border-top: 2px solid #f0f0f0; }
        .send-btn { width: 100%; padding: 15px; background-color: #25D366; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .send-btn:active { background-color: #128C7E; }
    </style>
</head>
<body>

    <h2>Оформление заказа</h2>

    <div class="form-group">
        <label>Название ИП (необязательно):</label>
        <input type="text" id="ipName" placeholder="Введите название ИП">
    </div>

    <div class="form-group">
        <label>Адрес (необязательно):</label>
        <input type="text" id="address" placeholder="Введите адрес">
    </div>

    <div class="catalog">
        <h3>Каталог товаров</h3>

        <!-- Позиция 1 -->
        <div class="product-item">
            <div class="product-info">
                <div class="product-title">Наименование товара 1</div>
                <div class="product-price">1000 ₸</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty('p1', -1)">-</button>
                <input type="number" id="p1" class="qty-input" value="0" min="0" data-name="Наименование товара 1" data-price="1000" onchange="calculateTotal()">
                <button class="qty-btn" onclick="changeQty('p1', 1)">+</button>
            </div>
        </div>

        <!-- Позиция 2 -->
        <div class="product-item">
            <div class="product-info">
                <div class="product-title">Наименование товара 2</div>
                <div class="product-price">1500 ₸</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty('p2', -1)">-</button>
                <input type="number" id="p2" class="qty-input" value="0" min="0" data-name="Наименование товара 2" data-price="1500" onchange="calculateTotal()">
                <button class="qty-btn" onclick="changeQty('p2', 1)">+</button>
            </div>
        </div>

        <!-- Позиция 3 -->
        <div class="product-item">
            <div class="product-info">
                <div class="product-title">Наименование товара 3</div>
                <div class="product-price">2000 ₸</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty('p3', -1)">-</button>
                <input type="number" id="p3" class="qty-input" value="0" min="0" data-name="Наименование товара 3" data-price="2000" onchange="calculateTotal()">
                <button class="qty-btn" onclick="changeQty('p3', 1)">+</button>
            </div>
        </div>

        <div class="total-box">Итого: <span id="totalSum">0</span> ₸</div>
    </div>

    <div class="form-group" style="margin-top: 15px;">
        <label>Комментарий к заказу:</label>
        <textarea id="comment" rows="3" placeholder="Дополнительные пожелания..."></textarea>
    </div>

    <button class="send-btn" onclick="sendToWhatsApp()">Отправить в WhatsApp</button>

    <script>
        function changeQty(id, delta) {
            const input = document.getElementById(id);
            let val = parseInt(input.value) || 0;
            val = Math.max(0, val + delta);
            input.value = val;
            calculateTotal();
        }

        function calculateTotal() {
            const items = document.querySelectorAll('.qty-input');
            let total = 0;
            items.forEach(item => {
                const qty = parseInt(item.value) || 0;
                const price = parseInt(item.getAttribute('data-price')) || 0;
                total += qty * price;
            });
            document.getElementById('totalSum').innerText = total;
        }

        function sendToWhatsApp() {
            const ipName = document.getElementById('ipName').value.trim();
            const address = document.getElementById('address').value.trim();
            const comment = document.getElementById('comment').value.trim();
            const items = document.querySelectorAll('.qty-input');

            let orderList = "";
            let totalSum = 0;

            items.forEach(item => {
                const qty = parseInt(item.value) || 0;
                if (qty > 0) {
                    const name = item.getAttribute('data-name');
                    const price = parseInt(item.getAttribute('data-price'));
                    const sum = qty * price;
                    totalSum += sum;
                    orderList += `• ${name} — ${qty} шт. x ${price} = ${sum} ₸\n`;
                }
            });

            if (!orderList) {
                alert("Выберите хотя бы один товар!");
                return;
            }

            let message = "📦 *Новый заказ*\n\n";
            if (ipName) message += `🏢 *ИП:* ${ipName}\n`;
            if (address) message += `📍 *Адрес:* ${address}\n`;
            
            message += `\n🛒 *Выбранные товары:*\n${orderList}`;
            message += `\n💰 *Итого:* ${totalSum} ₸\n`;
            
            if (comment) message += `\n📝 *Комментарий:* ${comment}\n`;

            const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(message);
            window.open(waUrl, '_blank');
        }
    </script>

</body>
</html>
