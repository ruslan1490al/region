<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ товаров</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; max-width: 500px; margin: 0 auto; }
        .field { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background-color: #25D366; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #128C7E; }
    </style>
</head>
<body>

    <h2>Оформление заказа</h2>

    <div class="field">
        <label>Название ИП (необязательно):</label>
        <input type="text" id="ipName" placeholder="Введите название ИП">
    </div>

    <div class="field">
        <label>Адрес (необязательно):</label>
        <input type="text" id="address" placeholder="Введите адрес">
    </div>

    <div class="field">
        <label>Содержание заказа / Комментарий:</label>
        <textarea id="orderComment" rows="4" placeholder="Список товаров или комментарий к заказу..."></textarea>
    </div>

    <button onclick="sendToWhatsApp()">Отправить в WhatsApp</button>

    <script>
        function sendToWhatsApp() {
            const ipName = document.getElementById('ipName').value.trim();
            const address = document.getElementById('address').value.trim();
            const comment = document.getElementById('orderComment').value.trim();

            let message = "📦 *Новый заказ*\n\n";

            // Добавляем ИП и Адрес только если они заполнены
            if (ipName) {
                message += "🏢 *ИП:* " + ipName + "\n";
            }
            if (address) {
                message += "📍 *Адрес:* " + address + "\n";
            }
            if (comment) {
                message += "\n📝 *Заказ / Комментарий:*\n" + comment + "\n";
            }

            // Универсальная ссылка без номера — откроет выбор контакта в WhatsApp
            const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(message);

            window.open(waUrl, '_blank');
        }
    </script>

</body>
</html>
